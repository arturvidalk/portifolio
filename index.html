<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            scroll-behavior: smooth;
        }

        .navbar {
            position: relative;
        }

        .navbar-brand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            font-weight: bold;
        }

        .centro {
            height: 100vh;
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .btn-dark:hover {
            background-color: #fff;
            color: #000;
            border-color: #fff;
        }

        .btn-outline-dark:hover {
            background-color: #000;
            color: #fff;
        }

        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-light bg-light py-5">
        <div class="container-fluid">
            <a class="navbar-brand fs-2" href="#">Portfólio</a>
        </div>
    </nav>
    <section class="centro">
        <div class="container">
            <h1 class="display-4">Olá, eu sou Artur</h1>
            <p class="lead">Desenvolvedor e estudante do curso técnico em informática no IFMG Campus São João Evangelista</p>
            <button class="btn btn-light btn-lg mt-3">Ver Projetos</button>
        </div>
        <div class="col-md-6 text-center mt-4 mt-md-0">
            <img src="https://suap.ifmg.edu.br/media/alunos/150x200/68180.JBw3Amhd6Ywi.jpg"
                 alt="Minha foto"
                 width="400">
        </div>
    </section>
    <section id="sobre" class="py-5">
    </section>
    </footer>
</body>

</html>
